name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov mypy ruff black

      - name: Lint with ruff & check formatting with black
        run: |
          ruff check src/ tests/
          black --check src/ tests/

      - name: Type check with mypy
        run: |
          mypy src/netejator98/shared src/netejator98/access/domain src/netejator98/sanitisation/domain src/netejator98/audit/domain

      - name: Run test suite with coverage
        run: |
          pytest --cov=src/netejator98 --cov-report=term-missing tests/

