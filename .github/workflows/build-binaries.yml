name: Build Cross-Platform Standalone Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: netejator98-linux-x86_64
            output_name: netejator98
          - os: windows-latest
            artifact_name: netejator98-windows-x64.exe
            output_name: netejator98.exe
          # - os: macos-latest
          #   artifact_name: netejator98-macos-x86_64
          #   output_name: netejator98

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build standalone binary with build.py
        run: python build.py

      - name: Rename binary for distribution
        shell: bash
        run: |
          mkdir -p release_dist
          if [ -f "dist/${{ matrix.output_name }}" ]; then
            cp "dist/${{ matrix.output_name }}" "release_dist/${{ matrix.artifact_name }}"
          fi

      - name: Upload temporary binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release_dist/${{ matrix.artifact_name }}
          retention-days: 1

  release:
    name: Publish Public GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Publish Binaries to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Netejator98 - Última versió (Build automatitzat)' }}
          prerelease: false
          make_latest: "true"
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

